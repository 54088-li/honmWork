<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>京东商品导购</title>
    <style>
        * { margin: 0; padding: 0; }

        body {
            background-color: #f5f5f5;
            font-family: "Microsoft YaHei", sans-serif;
        }

        /* 导购区容器 */
        .guide-box {
            width: 740px;
            height: 620px;
            margin: 50px auto;
            border-radius: 15px;
            background-color: #fff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
            box-sizing: border-box;
        }

        .guide-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }

        /* 商品列表 */
        .product-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        /* 每个商品 */
        .product {
            width: 220px;
            margin-bottom: 20px;
            padding: 10px;
            border: 10px groove #9966cc;
            box-shadow: 3px 3px 8px #ccc;
            background-color: #fff;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            box-sizing: border-box;
        }

        /* 鼠标悬停效果 */
        .product:hover {
            border-style: dashed;
            border-color: #9999cc;
        }

        .product img {
            width: 180px;
            height: 150px;
            display: block;
            margin: 0 auto 10px;
        }

        .product-name {
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            line-height: 1.4;
            height: 40px;
            overflow: hidden;
        }

        .product-price {
            font-size: 16px;
            color: #e4393c;
            font-weight: bold;
        }

        .product-price::before {
            content: "￥";
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="guide-box">
        <h2 class="guide-title">京东商品导购</h2>
        <div class="product-list">
            <div class="product">
                <img src="image5-2-1.jpg" alt="商品1">
                <p class="product-name">潮流男装 夏季新款T恤</p>
                <p class="product-price">99.00</p>
            </div>
            <div class="product">
                <img src="image5-2-2.jpg" alt="商品2">
                <p class="product-name">时尚女鞋 舒适百搭</p>
                <p class="product-price">299.00</p>
            </div>
            <div class="product">
                <img src="image5-2-3.jpg" alt="商品3">
                <p class="product-name">智能手机 全网通</p>
                <p class="product-price">1999.00</p>
            </div>
            <div class="product">
                <img src="image5-2-4.jpg" alt="商品4">
                <p class="product-name">精美家居 创意摆件</p>
                <p class="product-price">59.00</p>
            </div>
            <div class="product">
                <img src="image5-2-5.jpg" alt="商品5">
                <p class="product-name">美味零食 休闲小吃</p>
                <p class="product-price">29.90</p>
            </div>
            <div class="product">
                <img src="image5-2-6.jpg" alt="商品6">
                <p class="product-name">数码配件 耳机音箱</p>
                <p class="product-price">199.00</p>
            </div>
        </div>
    </div>
</body>
</html>
